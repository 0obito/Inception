events {}

http {
    include /etc/nginx/mime.types;

    server {
        listen 443 ssl;
        server_name aelmsafe.42.fr;

        ssl_certificate /etc/nginx/ssl/inception.crt;
        ssl_certificate_key /etc/nginx/ssl/inception.key;

        # Inception strictly mandates TLSv1.2 or TLSv1.3
        ssl_protocols TLSv1.2 TLSv1.3;

        root /var/www/html;
        index index.php index.html index.htm;

        # Route standard requests to the filesystem
        location / {
            try_files $uri $uri/ /index.php?$args;
        }

        # Route PHP execution to the WordPress container
        location ~ \.php$ {
            include fastcgi_params;
            fastcgi_split_path_info ^(.+\.php)(/.+)$;

            # This hostname matches the service name in docker-compose.yml
            fastcgi_pass wordpress:9000;
            fastcgi_index index.php;

            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param PATH_INFO $fastcgi_path_info;
        }
    }
}